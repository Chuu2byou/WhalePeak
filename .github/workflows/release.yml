# Release: build the .plasmoid archive and attach it to a GitHub release.
#
# A push of a version tag (vX.Y.Z) runs the unit tests, packages the applet and
# publishes dist/whalepeak.plasmoid as a release asset. The version in
# metadata.json must match the tag. Can also be triggered manually from the
# Actions tab; tools/release.sh creates and pushes the tag for you.
name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, must match metadata.json (e.g. v1.0.0)'
        required: true
        type: string

# The release step needs to create the release and upload assets.
permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: make test
        run: make test

  release:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is the only source of the release name, so refuse to publish a
      # package whose metadata.json says something else.
      - name: Check tag against metadata.json
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          version="$(python3 -c 'import json; print(json.load(open("metadata.json", encoding="utf-8"))["KPlugin"]["Version"])')"
          if [ "$tag" != "v$version" ]; then
            printf 'Tag %s does not match metadata.json version %s (expected v%s).\n' \
              "$tag" "$version" "$version" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build the package
        run: make package

      # gh is preinstalled on the runners; GITHUB_TOKEN comes from the workflow
      # permissions above. Re-running a release replaces the assets instead of
      # failing on the existing release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(dist/*.plasmoid)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "WhalePeak $TAG" --generate-notes --target "$GITHUB_SHA"
          fi
